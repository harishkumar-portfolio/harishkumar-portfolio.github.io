<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Harish Kumar | Graphic Designer | Brand Identity Designer | Web Designer & Developer | Print Specialist</title>

<meta name="description" content="Harish Kumar — Graphic Designer, Brand Identity Designer, Web Designer & Developer, and Print Specialist. Open to opportunities in India and Dubai.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root{
    --bg:#07070b;
    --fg:#FFFFFF;
    --fg-dim:#E2E8F0;
    --border:rgba(255,255,255,0.15);
    --glass:rgba(255,255,255,0.05);
    --violet:#8B5CF6;
    --cyan:#00F5D4;
    --orange:#FF7A45;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html{
    scroll-behavior:smooth;
    overflow-x:hidden;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'Plus Jakarta Sans',sans-serif;
    overflow-x:hidden;
  }

  img{
    max-width:100%;
    height:auto;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  button,
  input,
  textarea{
    font-family:inherit;
  }

  /* Smooth mobile scrolling */
  body{
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:auto;
  }

  .glass{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }

  /* Floating social buttons */
  .social-dock{
    position:fixed;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    z-index:999;
    display:flex;
    flex-direction:column;
    padding:.5rem .3rem;
    gap:.4rem;
    border-radius:16px;
  }

  .social-dock a{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    transition:transform .2s ease;
  }

  .social-dock a:hover{
    transform:scale(1.08);
  }

  /* Mobile */
  @media(max-width:768px){

    html{
      scroll-behavior:auto;
    }

    .social-dock{
      right:4px;
      top:30%;
      transform:none;
      padding:.4rem .2rem;
      gap:.3rem;
      border-radius:12px;
    }

    .social-dock a{
      width:30px;
      height:30px;
      font-size:.8rem;
    }

    /* Reduce expensive visual effects on phones */
    .glass{
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }
  }
