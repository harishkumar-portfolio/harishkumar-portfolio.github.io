<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>ASHLEE — Identity &amp; Packaging | Harish Kumar</title>
<meta name="description" content="A visual identity and packaging presentation for ASHLEE, bringing the brand language together across logo, typography, colour and product presentation.">
<style>
:root{--bg:#07070b;--fg:#fff;--dim:#b8bec8;--border:rgba(255,255,255,.11);--glass:rgba(255,255,255,.035);--cyan:#00F5D4;--violet:#8B5CF6;--orange:#FF7A45;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;line-height:1.65;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 10% 10%,rgba(139,92,246,.16),transparent 30%),radial-gradient(circle at 90% 30%,rgba(0,245,212,.10),transparent 30%),radial-gradient(circle at 45% 100%,rgba(255,122,69,.10),transparent 30%)}
a{color:inherit;text-decoration:none}.wrap{width:min(1180px,90vw);margin:auto}
.topbar{position:sticky;top:0;z-index:20;padding:16px 0;background:rgba(7,7,11,.72);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .inner{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-family:'Sora',Arial,sans-serif;font-weight:800;letter-spacing:-.04em;font-size:1.1rem}.logo span{color:var(--cyan)}
.back{display:inline-flex;align-items:center;gap:8px;color:#dce2ea;font-size:.85rem;font-weight:700}.back:hover{color:var(--cyan)}
.hero{padding:90px 0 55px}.kicker{font-family:'Sora',Arial,sans-serif;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:14px}
h1{font-family:'Sora',Arial,sans-serif;font-size:clamp(2.5rem,7vw,5.8rem);line-height:.96;letter-spacing:-.06em;max-width:900px}.intro{max-width:720px;color:var(--dim);margin-top:22px;font-size:1.03rem}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.chip{border:1px solid var(--border);background:var(--glass);padding:8px 13px;border-radius:999px;font-size:.76rem;font-weight:700;color:#e8edf3}
.cover{margin:10px 0 65px;border:1px solid var(--border);border-radius:24px;overflow:hidden;background:#101017;box-shadow:0 30px 90px rgba(0,0,0,.3)}
.cover img{width:100%;height:auto;display:block;max-height:none;object-fit:contain}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding-bottom:70px}
.gallery{align-items:start;}
.item{align-self:start;height:max-content;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--glass);cursor:zoom-in;transition:transform .5s var(--ease),border-color .35s,box-shadow .5s var(--ease)}
.item:hover{transform:translateY(-6px);border-color:rgba(0,245,212,.3);box-shadow:0 25px 65px rgba(0,0,0,.28)}.item img{width:100%;height:auto !important;aspect-ratio:auto !important;object-fit:contain !important;display:block}
.footer-nav{display:flex;justify-content:space-between;gap:15px;padding:28px 0 55px;border-top:1px solid rgba(255,255,255,.08)}.next{color:var(--cyan);font-weight:800;font-size:.85rem}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;padding:30px}
.lightbox.active{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 80px #000}
.close{position:fixed;top:20px;right:20px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:24px;cursor:pointer}
@media(max-width:700px){.hero{padding:60px 0 35px}.gallery{grid-template-columns:1fr}.cover{margin-bottom:40px}h1{font-family:'Sora',Arial,sans-serif;font-size:clamp(2.5rem,13vw,4rem)}}

h1,h2,h3,h4,.kicker{font-family:'Sora',Arial,sans-serif;}

/* Natural image bounds + subtle sweep */
.item{position:relative;}
.item:after{content:"";position:absolute;top:-40%;left:-85%;width:45%;height:180%;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(12deg);opacity:0;}
.item:hover:after{animation:itemShine 1s cubic-bezier(.16,1,.3,1) both;}
@keyframes itemShine{0%{left:-85%;opacity:0}12%{opacity:1}100%{left:135%;opacity:0}}
h1{ text-wrap:balance; }
</style></head>
<body>
<header class="topbar"><div class="wrap inner"><a class="logo" href="../../index.html">HK<span>.</span></a><a class="back" href="../../index.html">← Back to Portfolio</a></div></header>
<main>
<section class="hero"><div class="wrap"><div class="kicker">01 — Brand Identity &amp; Packaging</div><h1>ASHLEE — Identity &amp; Packaging</h1><p class="intro">A visual identity and packaging presentation for ASHLEE, bringing the brand language together across logo, typography, colour and product presentation.</p><div class="meta"><span class="chip">Illustrator</span><span class="chip">Photoshop</span><span class="chip">Lightroom</span></div></div></section>
<section class="wrap"><div class="cover"><img src="BR%20ID1.webp" alt="ASHLEE — Identity &amp; Packaging cover"></div><div class="gallery">      <button class="item" type="button" data-src="BR%20ID2.webp" aria-label="Open BR ID2.webp"><img loading="lazy" src="BR%20ID2.webp" alt="ASHLEE project image 2"></button>
      <button class="item" type="button" data-src="BR%20ID3.webp" aria-label="Open BR ID3.webp"><img loading="lazy" src="BR%20ID3.webp" alt="ASHLEE project image 3"></button>
      <button class="item" type="button" data-src="BR%20ID4.webp" aria-label="Open BR ID4.webp"><img loading="lazy" src="BR%20ID4.webp" alt="ASHLEE project image 4"></button>
      <button class="item" type="button" data-src="BR%20ID5.webp" aria-label="Open BR ID5.webp"><img loading="lazy" src="BR%20ID5.webp" alt="ASHLEE project image 5"></button></div>
<nav class="footer-nav"><span></span><a class="next" href="../Graphic%20Desing%20%26%20ADS/index.html">Graphic Design &amp; Ads →</a></nav></section>
</main>
<div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" id="close" aria-label="Close preview">×</button><img id="lightboxImg" src="" alt="Expanded project preview"></div>
<script>
const box=document.getElementById('lightbox'),big=document.getElementById('lightboxImg'),close=document.getElementById('close');
document.querySelectorAll('.item').forEach(item=>item.addEventListener('click',()=>{big.src=item.dataset.src;box.classList.add('active');box.setAttribute('aria-hidden','false')}));
function shut(){box.classList.remove('active');box.setAttribute('aria-hidden','true');big.src=''}
close.addEventListener('click',shut);box.addEventListener('click',e=>{if(e.target===box)shut()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
</script></body></html>
